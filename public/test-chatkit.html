<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatKit Script Test</title>
    <script src="https://cdn.platform.openai.com/deployments/chatkit/chatkit.js"></script>
</head>
<body>
    <h1>ChatKit Script Loading Test</h1>
    <div id="status">Checking ChatKit availability...</div>
    
    <script>
        // Test if ChatKit is available
        function checkChatKit() {
            const statusDiv = document.getElementById('status');
            
            if (typeof window.ChatKit !== 'undefined') {
                statusDiv.innerHTML = '✅ ChatKit is loaded successfully!';
                statusDiv.style.color = 'green';
                console.log('ChatKit object:', window.ChatKit);
                
                // Test sentinel frame loading
                testSentinelFrame();
            } else {
                statusDiv.innerHTML = '❌ ChatKit failed to load';
                statusDiv.style.color = 'red';
                console.error('ChatKit not available');
            }
        }
        
        // Test sentinel frame loading
        function testSentinelFrame() {
            const sentinelUrls = [
                'https://sentinel.openai.com/backend-api/sentinel/frame.html',
                'https://sentinel.openai.com/cdn-cgi/challenge-platform/scripts/jsd/main.js',
                'https://sentinel.openai.com/backend-api/sentinel/req'
            ];
            
            console.log('Testing sentinel endpoints...');
            
            sentinelUrls.forEach((url, index) => {
                console.log(`Testing ${index + 1}: ${url}`);
                
                // Test script loading for JS files
                if (url.includes('.js')) {
                    const script = document.createElement('script');
                    script.src = url;
                    script.onload = function() {
                        console.log(`✅ Script loaded successfully: ${url}`);
                    };
                    script.onerror = function() {
                        console.error(`❌ Script failed to load: ${url}`);
                    };
                    document.head.appendChild(script);
                    
                    // Remove script after test
                    setTimeout(() => {
                        if (document.head.contains(script)) {
                            document.head.removeChild(script);
                        }
                    }, 3000);
                } else {
                    // Test iframe loading for HTML files
                    const iframe = document.createElement('iframe');
                    iframe.src = url;
                    iframe.style.display = 'none';
                    iframe.onload = function() {
                        console.log(`✅ Frame loaded successfully: ${url}`);
                    };
                    iframe.onerror = function() {
                        console.error(`❌ Frame failed to load: ${url}`);
                    };
                    
                    document.body.appendChild(iframe);
                    
                    // Remove iframe after test
                    setTimeout(() => {
                        if (document.body.contains(iframe)) {
                            document.body.removeChild(iframe);
                        }
                    }, 3000);
                }
            });
        }
        
        // Check after a short delay to allow script to load
        setTimeout(checkChatKit, 1000);
        
        // Also check immediately
        checkChatKit();
    </script>
</body>
</html>
