<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatKit Script Test</title>
    <script src="https://cdn.platform.openai.com/deployments/chatkit/chatkit.js"></script>
</head>
<body>
    <h1>ChatKit Script Loading Test</h1>
    <div id="status">Checking ChatKit availability...</div>
    
    <script>
        // Test if ChatKit is available
        function checkChatKit() {
            const statusDiv = document.getElementById('status');
            
            if (typeof window.ChatKit !== 'undefined') {
                statusDiv.innerHTML = '✅ ChatKit is loaded successfully!';
                statusDiv.style.color = 'green';
                console.log('ChatKit object:', window.ChatKit);
                
                // Test sentinel frame loading
                testSentinelFrame();
            } else {
                statusDiv.innerHTML = '❌ ChatKit failed to load';
                statusDiv.style.color = 'red';
                console.error('ChatKit not available');
            }
        }
        
        // Test sentinel frame loading
        function testSentinelFrame() {
            const sentinelUrl = 'https://sentinel.openai.com/backend-api/sentinel/frame.html';
            console.log('Testing sentinel frame:', sentinelUrl);
            
            // Try to create an iframe to test sentinel frame loading
            const iframe = document.createElement('iframe');
            iframe.src = sentinelUrl;
            iframe.style.display = 'none';
            iframe.onload = function() {
                console.log('✅ Sentinel frame loaded successfully');
            };
            iframe.onerror = function() {
                console.error('❌ Sentinel frame failed to load');
            };
            
            document.body.appendChild(iframe);
            
            // Remove iframe after test
            setTimeout(() => {
                document.body.removeChild(iframe);
            }, 3000);
        }
        
        // Check after a short delay to allow script to load
        setTimeout(checkChatKit, 1000);
        
        // Also check immediately
        checkChatKit();
    </script>
</body>
</html>
